name: Build llama.cpp Android ARM64

on:
  push:
    paths:
      - ".github/workflows/build-llama-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: "28.2.13676358"
      LLAMA_CPP_REV: "0c1e57098bba43ac29e6e3b677cdceebdd22334f"
    steps:
      - uses: actions/checkout@v4

      - name: Use preinstalled Android SDK and install NDK
        shell: bash
        run: |
          test -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Checkout pinned llama.cpp
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp fetch --depth=1 origin "${LLAMA_CPP_REV}"
          git -C llama.cpp checkout --detach FETCH_HEAD
          git -C llama.cpp submodule update --init --recursive --depth=1

      - name: Configure Android arm64-v8a
        shell: bash
        run: |
          cmake -S llama.cpp -B llama-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON

      - name: Build llama-server
        run: cmake --build llama-build --target llama-server --parallel

      - name: Stage
        shell: bash
        run: |
          mkdir -p artifact
          cp llama-build/bin/llama-server artifact/libllama_server_bin.so
          chmod 755 artifact/libllama_server_bin.so
          sha256sum artifact/libllama_server_bin.so | tee artifact/SHA256SUMS.txt
          file artifact/libllama_server_bin.so
          readelf -d artifact/libllama_server_bin.so | grep NEEDED || true

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-android-arm64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
